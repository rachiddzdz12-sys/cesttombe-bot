name: LE BRUIT · publication des rendus validés + essai voix d'homme

on:
  push:
    branches: [publier-lebruit]

permissions:
  contents: write

concurrency:
  group: publier-lebruit
  cancel-in-progress: false

jobs:
  publier:
    runs-on: ubuntu-latest
    timeout-minutes: 60
    env:
      COMPTE: lebruit
      GEMINI_API_KEY: ${{ secrets.GEMINI_API_KEY }}
      IG_ACCESS_TOKEN: ${{ secrets.IG_ACCESS_TOKEN }}
      GITHUB_TOKEN: ${{ github.token }}
      IMAGES_TOKEN: ${{ secrets.IMAGES_TOKEN }}
      IMAGES_REPO: ${{ vars.IMAGES_REPO }}
      GEMINI_MODEL: ${{ vars.GEMINI_MODEL }}
      APIFY_TOKEN: ${{ secrets.APIFY_TOKEN }}
    steps:
      - uses: actions/checkout@v6
        with:
          fetch-depth: 0
      - uses: actions/setup-python@v6
        with:
          python-version: "3.12"
          cache: pip
      - uses: actions/cache@v4
        with:
          path: ~/.cache/huggingface
          key: whisper-small-v1
      - name: Installation
        run: |
          pip install -r requirements.txt
          pip install --no-deps rapidocr-onnxruntime==1.2.3
          which ffmpeg || (sudo apt-get update -qq && sudo apt-get install -y -qq ffmpeg)
      - name: Rendus validés (essai du 15/11, 22h28)
        run: |
          git fetch -q origin 8823ef808a042eb7c469893121e8cf4a6a6a1d70
          mkdir -p /tmp/rendus && git archive 8823ef808a042eb7c469893121e8cf4a6a6a1d70 | tar -x -C /tmp/rendus
          ls /tmp/rendus
      - name: Publication sur @le.bruit.rap
        run: python ponctuel/publier_rendus.py /tmp/rendus ponctuel/lebruit-2026-11-15.json 2>&1 | grep -v onnxruntime | tee /tmp/journal-publication.txt
      - name: État de LE BRUIT sauvegardé sur main
        if: always()
        run: |
          [ -f etat-lebruit.json ] || exit 0
          cp etat-lebruit.json /tmp/etat-lebruit.json
          git config user.name "cesttombe-bot"
          git config user.email "cesttombe-bot@users.noreply.github.com"
          git stash -q -u || true
          git checkout -q -B main origin/main
          for i in 1 2 3 4 5; do
            git fetch -q origin main && git reset -q --hard origin/main
            cp /tmp/etat-lebruit.json etat-lebruit.json
            git add etat-lebruit.json
            git diff --cached --quiet && break
            git commit -q -m "état LE BRUIT : 3 posts publiés à la main"
            git push -q origin main && break
            sleep 6
          done
      - name: Essai voix d'homme sur le post Ninho (ne publie rien)
        if: always()
        env:
          MODE: test
          HEBERGEMENT: "non"
          TEST_N: "1"
          VOIX_GENRE: homme
          TEST_FILTRE: "NINHO a r.alis. les DEUX MEILLEURS"
        run: |
          mkdir -p sortie
          python main.py 2>&1 | grep -v onnxruntime | tee sortie/journal-voix-homme.txt
      - name: Rendus déposés sur la branche lebruit-voix-homme
        if: always()
        run: |
          mkdir -p /tmp/sortie
          cp /tmp/journal-publication.txt /tmp/sortie/ 2>/dev/null || true
          find sortie -maxdepth 1 -type f \( -name "*.jpg" -o -name "*.mp4" -o -name "*.txt" -o -name "*.json" \) -exec cp {} /tmp/sortie/ \;
          cd /tmp/sortie
          git init -q -b lebruit-voix-homme
          git config user.name "cesttombe-bot"
          git config user.email "cesttombe-bot@users.noreply.github.com"
          git add -A && git commit -q -m "Publication LE BRUIT + essai voix d'homme"
          git push -q --force "https://x-access-token:${{ github.token }}@github.com/${{ github.repository }}.git" lebruit-voix-homme
