name: Rafale de tweets (demandée à la main)

on:
  push:
    branches: [rafale-tweets]

permissions:
  contents: write

concurrency:
  group: cesttombe            # jamais en même temps que le bot principal
  cancel-in-progress: false

jobs:
  rafale:
    runs-on: ubuntu-latest
    timeout-minutes: 90
    steps:
      - uses: actions/checkout@v6
        with:
          ref: main
      - name: Script de la rafale
        run: git fetch -q origin rafale-tweets && git checkout -q FETCH_HEAD -- ponctuel/tweets.py
      - uses: actions/setup-python@v6
        with:
          python-version: "3.12"
          cache: pip
      - name: Installation
        run: |
          pip install -r requirements.txt
          pip install --no-deps rapidocr-onnxruntime==1.2.3
          which ffmpeg || (sudo apt-get update -qq && sudo apt-get install -y -qq ffmpeg)
      - name: Publication
        env:
          COMPTE: FrenchRapUS
          NOMBRE: "10"
          GEMINI_API_KEY: ${{ secrets.GEMINI_API_KEY }}
          IG_ACCESS_TOKEN: ${{ secrets.IG_ACCESS_TOKEN }}
          IG_USER_ID: ${{ secrets.IG_USER_ID }}
          GITHUB_TOKEN: ${{ github.token }}
          IMAGES_TOKEN: ${{ secrets.IMAGES_TOKEN }}
          IMAGES_REPO: ${{ vars.IMAGES_REPO }}
          GEMINI_MODEL: ${{ vars.GEMINI_MODEL }}
          APIFY_TOKEN: ${{ secrets.APIFY_TOKEN }}
        run: python ponctuel/tweets.py 2>&1 | grep -v onnxruntime | tee journal.txt
      - name: État enregistré sur main
        if: always()
        run: |
          git config user.name "cesttombe-bot"
          git config user.email "cesttombe-bot@users.noreply.github.com"
          cp etat.json /tmp/etat.json
          for essai in 1 2 3; do
            git fetch -q origin main && git checkout -q -B maj origin/main
            cp /tmp/etat.json etat.json
            git add etat.json && (git diff --cached --quiet || git commit -q -m "état : rafale de tweets @FrenchRapUS")
            git push -q origin maj:main && break
            sleep 5
          done
      - name: Journal
        if: always()
        run: |
          mkdir -p /tmp/j && cp journal.txt /tmp/j/ 2>/dev/null || true
          find sortie -maxdepth 1 -type f \( -name "*.jpg" -o -name "*-legende.txt" \) -exec cp {} /tmp/j/ \;
          cd /tmp/j && git init -q -b rafale-tweets-journal
          git config user.name "cesttombe-bot" && git config user.email "cesttombe-bot@users.noreply.github.com"
          git add -A && git commit -q -m "Journal rafale tweets" && \
          git push -q --force "https://x-access-token:${{ github.token }}@github.com/${{ github.repository }}.git" rafale-tweets-journal
