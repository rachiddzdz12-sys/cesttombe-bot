name: Diagnostic Instagram (lecture seule)
on:
  push:
    branches: [diag-ig]
permissions:
  contents: write
jobs:
  diag:
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - name: Posts publiés
        env:
          T: ${{ secrets.IG_ACCESS_TOKEN }}
          U: ${{ secrets.IG_USER_ID }}
        run: |
          python3 - <<'PY' > /tmp/diag.txt
          import json, os, requests
          G = "https://graph.facebook.com/v25.0"
          t, u = os.environ["T"], os.environ["U"]
          url, params, n = f"{G}/{u}/media", {"access_token": t, "limit": 50,
                   "fields": "id,timestamp,media_type,media_product_type,caption,permalink"}, 0
          while url and n < 150:
              j = requests.get(url, params=params, timeout=30).json()
              if "error" in j:
                  print("ERREUR", j["error"]); break
              for m in j.get("data", []):
                  n += 1
                  cap = (m.get("caption") or "").replace("\n", " ⏎ ")[:420] if m["timestamp"] >= "2026-11-10" else ""
                  print(m["timestamp"][:16], m.get("media_product_type"), m["media_type"], m["id"], m["permalink"], "|", cap)
              url, params = j.get("paging", {}).get("next"), {}
          r = requests.get(f"{G}/{u}/content_publishing_limit", params={"access_token": t, "fields": "config,quota_usage"}, timeout=30)
          print("quota", r.text[:200])
          PY
          cat /tmp/diag.txt
          mkdir -p /tmp/o && cp /tmp/diag.txt /tmp/o/ && cd /tmp/o && git init -q -b diag-ig-sortie
          git config user.name bot && git config user.email bot@users.noreply.github.com
          git add -A && git commit -q -m diag && git push -q --force "https://x-access-token:${{ github.token }}@github.com/${{ github.repository }}.git" diag-ig-sortie
