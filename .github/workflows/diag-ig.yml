name: Suppression des posts en double (demandée)
on:
  push:
    branches: [diag-ig]
permissions:
  contents: write
jobs:
  suppr:
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - name: Suppression
        env:
          T: ${{ secrets.IG_ACCESS_TOKEN }}
        run: |
          python3 - <<'PY' > /tmp/diag.txt
          import os, requests, time
          G = "https://graph.facebook.com/v25.0"
          ids = ["18077482469750159", "17943391521369192", "18439436857182981", "18399121297204655",
                 "18126864976887070", "18145748809526076", "17980826361129353", "18136442668708131",
                 "17880964587633349"]
          for i in ids:
              r = requests.delete(f"{G}/{i}", params={"access_token": os.environ["T"]}, timeout=30)
              print(i, r.status_code, r.text[:300], flush=True)
              time.sleep(3)
          PY
          cat /tmp/diag.txt
          mkdir -p /tmp/o && cp /tmp/diag.txt /tmp/o/ && cd /tmp/o && git init -q -b diag-ig-sortie
          git config user.name bot && git config user.email bot@users.noreply.github.com
          git add -A && git commit -q -m suppr && git push -q --force "https://x-access-token:${{ github.token }}@github.com/${{ github.repository }}.git" diag-ig-sortie
