name: Story vidéo du post de 21h (C'EST TOMBÉ)

on:
  push:
    branches: [diag-story]

permissions:
  contents: read

jobs:
  story:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v6
      - uses: actions/setup-python@v6
        with:
          python-version: "3.12"
      - run: pip install -q requests
      - name: Story vidéo (le Reel hébergé par le bot)
        env:
          IG_ACCESS_TOKEN: ${{ secrets.IG_ACCESS_TOKEN }}
          IG_USER_ID: ${{ secrets.IG_USER_ID }}
        run: |
          python3 - <<'PY'
          import os, time
          from bot import instagram
          ig = os.environ["IG_USER_ID"]
          url = "https://raw.githubusercontent.com/rachiddzdz12-sys/cesttombe-bot/images/p/20261118-2101-jv-reel.mp4"
          cont = instagram._req("POST", f"{ig}/media", media_type="STORIES", video_url=url)["id"]
          for _ in range(40):
              st = instagram._req("GET", cont, fields="status_code,status")
              if st.get("status_code") in ("FINISHED", "ERROR", "EXPIRED"):
                  break
              time.sleep(5)
          print("conteneur vidéo :", st)
          if st.get("status_code") == "FINISHED":
              print("✅ STORY VIDÉO PUBLIÉE", instagram._req("POST", f"{ig}/media_publish", creation_id=cont)["id"])
          else:
              print("❌ vidéo refusée, raison :", st.get("status"))
          PY
