name: Essai voix 2 (ne publie rien)
on:
  push:
    branches: [essai-voix2]
permissions:
  contents: write
jobs:
  essai:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v6
      - name: ffmpeg
        run: which ffmpeg || (sudo apt-get update -qq && sudo apt-get install -y -qq ffmpeg)
      - name: Échantillons
        env:
          GEMINI_API_KEY: ${{ secrets.GEMINI_API_KEY }}
        run: test -n "$SAUTER" || python3 essais/voix2.py
      - name: Transcription (vérifier ce que dit chaque voix)
        if: always()
        run: |
          mkdir -p /tmp/r /tmp/da /tmp/x
          cp sortie/* /tmp/r/ 2>/dev/null || true
          (git fetch -q origin analyse-da-sortie && git archive FETCH_HEAD | tar -x -C /tmp/x && cp /tmp/x/*.mp4 /tmp/da/) >> /tmp/r/log-transcription.txt 2>&1 || true
          pip install -q faster-whisper >> /tmp/r/log-transcription.txt 2>&1 || true
          python3 essais/transcrire.py >> /tmp/r/log-transcription.txt 2>&1 || true
          ls /tmp/r /tmp/da >> /tmp/r/log-transcription.txt
      - name: Rendus
        if: always()
        run: |
          cd /tmp/r && git init -q -b essai-voix2-rendus
          git config user.name bot && git config user.email bot@users.noreply.github.com
          git add -A && git commit -q -m "voix" && git push -q --force "https://x-access-token:${{ github.token }}@github.com/${{ github.repository }}.git" essai-voix2-rendus
