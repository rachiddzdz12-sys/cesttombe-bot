name: DA v3 · essai (ne publie rien)

on:
  push:
    branches: [da-v3]

permissions:
  contents: write

concurrency:
  group: da-v3-essai
  cancel-in-progress: true

jobs:
  essai:
    runs-on: ubuntu-latest
    timeout-minutes: 60
    env:
      MODE: test
      HEBERGEMENT: "non"
      TEST_N: "2"
      GEMINI_API_KEY: ${{ secrets.GEMINI_API_KEY }}
      IG_ACCESS_TOKEN: ${{ secrets.IG_ACCESS_TOKEN }}
      IG_USER_ID: ${{ secrets.IG_USER_ID }}
      GEMINI_MODEL: ${{ vars.GEMINI_MODEL }}
      APIFY_TOKEN: ${{ secrets.APIFY_TOKEN }}
    steps:
      - uses: actions/checkout@v6
      - uses: actions/setup-python@v6
        with:
          python-version: "3.12"
          cache: pip
      - uses: actions/cache@v4
        with:
          path: ~/.cache/huggingface
          key: whisper-small-v1
      - name: Installation
        run: |
          pip install -r requirements.txt
          pip install --no-deps rapidocr-onnxruntime==1.2.3
          which ffmpeg || (sudo apt-get update -qq && sudo apt-get install -y -qq ffmpeg)
      - name: C'EST TOMBÉ · 2 vraies infos GTA (ne publie rien)
        continue-on-error: true
        run: |
          mkdir -p sortie
          python main.py 2>&1 | grep -v onnxruntime | tee sortie/journal-cesttombe.txt
      - name: LE BRUIT · 2 vraies infos rap (ne publie rien)
        continue-on-error: true
        env:
          COMPTE: lebruit
        run: |
          python main.py 2>&1 | grep -v onnxruntime | tee sortie/journal-lebruit.txt
      - name: Rendus déposés sur la branche da-v3-rendus
        if: always()
        run: |
          mkdir -p /tmp/rendus
          find sortie -maxdepth 1 -type f \( -name "*-reel.mp4" -o -name "*.txt" -o -name "*.json" -o -name "*-1.jpg" \) -exec cp {} /tmp/rendus/ \;
          cd /tmp/rendus
          git init -q -b da-v3-rendus
          git config user.name "cesttombe-bot"
          git config user.email "cesttombe-bot@users.noreply.github.com"
          git add -A && git commit -q -m "Rendus vidéos du sujet"
          git push -q --force "https://x-access-token:${{ github.token }}@github.com/${{ github.repository }}.git" da-v3-rendus
