name: C'EST TOMBÉ

on:
  schedule:
    # toutes les 30 min de 7h à 22h30 (heure UTC) ; le script vérifie lui-même l'heure de Paris
    - cron: "*/30 6-21 * * *"
  workflow_dispatch:
    inputs:
      mode:
        description: "test = génère sans publier · reel = publie un post maintenant · voix = échantillons de voix · auto = passage normal"
        type: choice
        options: [test, reel, voix, auto]
        default: test
      categorie:
        description: "catégorie à essayer en premier (auto = alterne)"
        type: choice
        options: [auto, gaming, rap]
        default: auto

permissions:
  contents: write

concurrency:
  group: cesttombe
  cancel-in-progress: false

jobs:
  bot:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    env:
      MODE: ${{ github.event.inputs.mode || 'auto' }}
      CATEGORIE: ${{ github.event.inputs.categorie || 'auto' }}
      PUBLICATION: ${{ vars.PUBLICATION }}
    steps:
      - uses: actions/checkout@v6

      - name: Dernière version de l'état
        # si deux déclenchements se suivent, le second doit voir le post publié par le premier
        run: git pull -q --ff-only origin main || true

      - name: Faut-il poster maintenant ?
        id: verif
        run: python3 main.py --verif

      - uses: actions/setup-python@v6
        if: steps.verif.outputs.lancer == 'true'
        with:
          python-version: "3.12"
          cache: pip

      - name: Installation
        if: steps.verif.outputs.lancer == 'true'
        run: |
          pip install -r requirements.txt
          which ffmpeg || (sudo apt-get update -qq && sudo apt-get install -y -qq ffmpeg)

      - name: Lecture des sources, rédaction, rendu, publication
        if: steps.verif.outputs.lancer == 'true'
        env:
          GEMINI_API_KEY: ${{ secrets.GEMINI_API_KEY }}
          IG_ACCESS_TOKEN: ${{ secrets.IG_ACCESS_TOKEN }}
          IG_USER_ID: ${{ secrets.IG_USER_ID }}
          GITHUB_TOKEN: ${{ github.token }}
          IMAGES_TOKEN: ${{ secrets.IMAGES_TOKEN }}
          IMAGES_REPO: ${{ vars.IMAGES_REPO }}
          GEMINI_MODEL: ${{ vars.GEMINI_MODEL }}
        run: python main.py

      - name: Carrousels générés (à télécharger)
        if: always() && steps.verif.outputs.lancer == 'true'
        uses: actions/upload-artifact@v6
        with:
          name: carrousels-${{ github.run_number }}
          path: sortie/
          if-no-files-found: ignore
          retention-days: 7

      - name: Sauvegarde de l'état
        if: always() && steps.verif.outputs.lancer == 'true' && env.MODE != 'test'
        run: |
          git config user.name "cesttombe-bot"
          git config user.email "cesttombe-bot@users.noreply.github.com"
          git add etat.json
          git diff --cached --quiet || (git commit -q -m "état : mise à jour" && git push -q)
